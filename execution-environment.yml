---
version: 3

images:
  # AAP 2.7 minimal EE on RHEL 9
  base_image:
    name: registry.redhat.io/ansible-automation-platform-27/ee-minimal-rhel9:latest

dependencies:
  galaxy:
    collections:
      - name: ansible.windows
        version: ">=2.5.0"
      - name: microsoft.ad
        version: ">=1.7.0"
  python:
    - pywinrm[kerberos]
    - requests-kerberos
  system:
    - krb5-workstation
    - krb5-libs

additional_build_steps:
  prepend_base: |
    RUN microdnf install -y krb5-workstation krb5-libs && microdnf clean all
  append_final: |
    RUN echo "MECM Standalone EE — AAP 2.7 — ansible.windows + microsoft.ad + pywinrm[kerberos]"
