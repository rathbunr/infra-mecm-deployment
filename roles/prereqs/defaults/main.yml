  - RSAT-AD-PowerShell
  - RSAT-ADDS
  - RSAT-AD-AdminCenter

# Firewall rules for MECM + SQL + WSUS
mecm_firewall_rules:
  - name: "SQL Server (TCP 1433)"
    localport: 1433
    protocol: tcp
    direction: in
    action: allow
    profiles: domain,private
  - name: "SMB (TCP 445)"
    localport: 445
    protocol: tcp
    direction: in
    action: allow
    profiles: domain,private
  - name: "MECM HTTP (TCP 80)"
    localport: 80
    protocol: tcp
    direction: in
    action: allow
    profiles: domain,private
  - name: "MECM HTTPS (TCP 443)"
    localport: 443
    protocol: tcp
    direction: in
    action: allow
    profiles: domain,private
  - name: "MECM Client Notification (TCP 10123)"
    localport: 10123
    protocol: tcp
    direction: in
    action: allow
    profiles: domain,private
  - name: "MECM WSUS HTTP (TCP 8530)"
    localport: 8530
    protocol: tcp
    direction: in
    action: allow
    profiles: domain,private
  - name: "MECM WSUS HTTPS (TCP 8531)"
    localport: 8531
    protocol: tcp
    direction: in
    action: allow
    profiles: domain,private
  - name: "MECM PXE (UDP 4011)"
    localport: 4011
    protocol: udp
    direction: in
    action: allow
    profiles: domain,private
