---
# ============================================================================
# post_config/tasks — Configure MP, DP, SUP, NAA, boundaries, client push
# ============================================================================
# CRITICAL: Every win_shell block imports the ConfigMgr module and sets the
# PSDrive.  Without this, all CM cmdlets throw CommandNotFoundException.
# ============================================================================

- name: Build ConfigMgr PowerShell preamble fact
  ansible.builtin.set_fact:
    _cm_preamble: |
      $ErrorActionPreference = "Stop"
      Import-Module "{{ mecm_install_directory }}\AdminConsole\bin\ConfigurationManager.psd1"
      $SiteCode = "{{ mecm_site_code }}"
      if (-not (Get-PSDrive -Name $SiteCode -ErrorAction SilentlyContinue)) {
        New-PSDrive -Name $SiteCode -PSProvider CMSite -Root "{{ inventory_hostname }}" | Out-Null
      }
      Set-Location "${SiteCode}:"
  tags: [postconfig]

- name: Wait for SMS WMI provider to be ready
  ansible.windows.win_shell: |
    $timeout = 600; $elapsed = 0
    do {
      try {
        $null = Get-WmiObject -Namespace "root\SMS" -Class SMS_ProviderLocation -ErrorAction Stop
        "ready"; break
      } catch { Start-Sleep -Seconds 15; $elapsed += 15 }
    } while ($elapsed -lt $timeout)
    if ($elapsed -ge $timeout) { throw "SMS Provider not ready after $timeout seconds" }
  changed_when: false
  tags: [postconfig]

- name: Configure Management Point for HTTPS
  ansible.windows.win_shell: |
    {{ _cm_preamble }}
    $mp = Get-CMManagementPoint -SiteSystemServerName "{{ inventory_hostname }}" -SiteCode $SiteCode -ErrorAction SilentlyContinue
    if ($mp) {
      Set-CMManagementPoint -SiteSystemServerName "{{ inventory_hostname }}" -SiteCode $SiteCode `
        -EnableSsl $true -ClientConnectionType InternetAndIntranet
      "updated"
    } else { "MP not found — verify site system role was installed by setup" }
  register: mp_config
  changed_when: "'updated' in mp_config.stdout"
  tags: [postconfig]

- name: Configure Distribution Point for HTTPS
  ansible.windows.win_shell: |
    {{ _cm_preamble }}
    $dp = Get-CMDistributionPoint -SiteSystemServerName "{{ inventory_hostname }}" -SiteCode $SiteCode -ErrorAction SilentlyContinue
    if ($dp) {
      Set-CMDistributionPoint -SiteSystemServerName "{{ inventory_hostname }}" -SiteCode $SiteCode `
        -ClientConnectionType InternetAndIntranet
      "updated"
    } else { "DP not found — verify site system role was installed by setup" }
  register: dp_config
  changed_when: "'updated' in dp_config.stdout"
  tags: [postconfig]

- name: Configure Software Update Point (local WSUS)
  ansible.windows.win_shell: |
    {{ _cm_preamble }}
    $sup = Get-CMSoftwareUpdatePoint -SiteSystemServerName "{{ inventory_hostname }}" -SiteCode $SiteCode -ErrorAction SilentlyContinue
    if (-not $sup) {
      Add-CMSoftwareUpdatePoint -SiteCode $SiteCode `
        -SiteSystemServerName "{{ inventory_hostname }}" `
        -ClientConnectionType Intranet `
        -WsusIisPort 8530 `
        -WsusIisSslPort 8531
      "added"
    } else { "SUP already configured" }
  register: sup_config
  changed_when: "'added' in sup_config.stdout"
  tags: [postconfig]

- name: Register NAA account and assign to Software Distribution
  ansible.windows.win_shell: |
    {{ _cm_preamble }}
    $secPwd = ConvertTo-SecureString "{{ sccm_naa_password }}" -AsPlainText -Force
    $existing = Get-CMAccount -UserName "{{ sccm_naa_account }}" -SiteCode $SiteCode -ErrorAction SilentlyContinue
    if (-not $existing) {
      New-CMAccount -UserName "{{ sccm_naa_account }}" -Password $secPwd -SiteCode $SiteCode
    }
    Set-CMSoftwareDistributionComponent -SiteCode $SiteCode `
      -NetworkAccessAccountName "{{ sccm_naa_account }}"
    "configured"
  no_log: true
  register: naa_config
  changed_when: "'configured' in naa_config.stdout"
  tags: [postconfig]

- name: Create / update Boundary Groups from AD Sites
  ansible.windows.win_shell: |
    {{ _cm_preamble }}
    {% for bg in mecm_boundary_groups %}
    $bgObj = Get-CMBoundaryGroup -Name "{{ bg.name }}" -ErrorAction SilentlyContinue
    if (-not $bgObj) {
      New-CMBoundaryGroup -Name "{{ bg.name }}" -Description "{{ bg.description | default('') }}"
    }
    {% for site in bg.ad_sites %}
    $boundary = Get-CMBoundary | Where-Object { $_.BoundaryType -eq 1 -and $_.Value -eq "{{ site }}" }
    if (-not $boundary) {
      New-CMBoundary -Type ADSite -Value "{{ site }}" -Name "{{ site }}"
    }
    Add-CMBoundaryToGroup -BoundaryName "{{ site }}" -BoundaryGroupName "{{ bg.name }}" -ErrorAction SilentlyContinue
    {% endfor %}
    {% endfor %}
  tags: [postconfig]

- name: Enable Client Push Installation
  ansible.windows.win_shell: |
    {{ _cm_preamble }}
    Set-CMClientPushInstallation -SiteCode $SiteCode `
      -EnableAutomaticClientPushInstallation ${{ client_push_enabled | string | lower }}
  tags: [postconfig]

- name: Final status
  ansible.builtin.debug:
    msg:
      - "MECM standalone primary site installation and post-configuration complete."
      - "Site Code: {{ mecm_site_code }}"
      - "IIS Certificate Thumbprint: {{ mecm_iis_cert_thumbprint | default('N/A') }}"
      - "Review SMS logs under {{ mecm_install_directory }}\\Logs and C:\\ConfigMgrSetup.log"
  tags: [postconfig]
