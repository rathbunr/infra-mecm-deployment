---
- name: Check if MECM is already installed
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\SMS\Setup
    name: "Full Version"
  register: mecm_reg
  tags: [mecm]

- name: Stage MECM prerequisite files
  ansible.windows.win_shell: |
    if (-not (Test-Path "{{ mecm_prereq_path }}")) {
      New-Item -Path "{{ mecm_prereq_path }}" -ItemType Directory -Force | Out-Null
    }
    robocopy "{{ mecm_prereq_unc }}" "{{ mecm_prereq_path }}" /E /NFL /NDL /NJH /NJS /nc /ns /np
    if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit $LASTEXITCODE" }
  args:
    creates: "{{ mecm_prereq_path }}\\redist"
  when: not mecm_reg.exists
  tags: [mecm]

- name: Template MECM unattended setup INI
  ansible.windows.win_template:
    src: mecm_setup.ini.j2
    dest: "{{ mecm_setup_ini }}"
  when: not mecm_reg.exists
  tags: [mecm]

- name: Execute MECM setup.exe /script (block/rescue for log capture)
  block:
    - name: Run MECM unattended installation
      ansible.windows.win_shell: |
        & "{{ mecm_setup_exe }}" /script "{{ mecm_setup_ini }}"
      args:
        creates: "{{ mecm_install_directory }}\\bin\\x64\\smsexec.exe"
      register: mecm_setup
      async: 7200
      poll: 30
  rescue:
    - name: Capture MECM setup log on failure
      ansible.windows.win_shell: |
        if (Test-Path "C:\ConfigMgrSetup.log") {
          Get-Content "C:\ConfigMgrSetup.log" -Tail 200
        } else {
          "ConfigMgrSetup.log not found"
        }
      register: setup_log
      changed_when: false

    - name: Fail with setup log
      ansible.builtin.fail:
        msg: |
          MECM setup.exe failed.
          Exit code / result: {{ mecm_setup | default({}) }}
          ----- last 200 lines of ConfigMgrSetup.log -----
          {{ setup_log.stdout }}
  when: not mecm_reg.exists
  tags: [mecm]

- name: Wait for SMS_EXECUTIVE service
  ansible.windows.win_service:
    name: SMS_EXECUTIVE
    state: started
  retries: 60
  delay: 15
  when: mecm_setup is changed
  tags: [mecm]

- name: Debug MECM setup result
  ansible.builtin.debug:
    var: mecm_setup
  when: mecm_setup is defined
  tags: [mecm]
