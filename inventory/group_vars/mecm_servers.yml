---
# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
mecm_site_code: "P01"
mecm_site_name: "Primary Site - Contoso"
mecm_install_directory: "C:\\Program Files\\Microsoft Configuration Manager"
mecm_prereq_path: "C:\\Temp\\MECM_Prereqs"

# ---------------------------------------------------------------------------
# Media locations (UNC paths accessible by the install account)
# ---------------------------------------------------------------------------
sql_media_unc: "\\\\fileserver.example.com\\software\\SQL2022"
mecm_media_unc: "\\\\fileserver.example.com\\software\\MECM_CB_2403"
mecm_prereq_unc: "\\\\fileserver.example.com\\software\\MECM_Prereqs"

# ---------------------------------------------------------------------------
# SQL Server settings
# ---------------------------------------------------------------------------
sql_instance_name: "MSSQLSERVER"
sql_data_dir: "D:\\SQLData"
sql_log_dir: "D:\\SQLLogs"
sql_tempdb_dir: "D:\\SQLTempDB"
sql_backup_dir: "D:\\SQLBackup"
sql_min_server_memory_mb: 8192
sql_max_server_memory_mb: 32768
sql_collation: "SQL_Latin1_General_CP1_CI_AS"

# ---------------------------------------------------------------------------
# AD / Domain
# ---------------------------------------------------------------------------
domain_name: "example.com"
domain_netbios: "EXAMPLE"
ad_schema_extended: false          # set true after first successful run if desired
system_management_container_created: false

# ---------------------------------------------------------------------------
# Certificate / PKI
# ---------------------------------------------------------------------------
ca_server: "{{ ca_server }}"                    # injected by AAP credential
ca_template_name: "{{ ca_template_name }}"      # injected by AAP credential
iis_cert_friendly_name: "MECM Site System Certificate"
iis_cert_subject: "CN={{ inventory_hostname }}"

# ---------------------------------------------------------------------------
# Boundary Groups (AD Site based)
# ---------------------------------------------------------------------------
mecm_boundary_groups:
  - name: "Default-Boundary-Group"
    description: "Default boundary group for primary site"
    ad_sites:
      - "Default-First-Site-Name"

# ---------------------------------------------------------------------------
# Client Push
# ---------------------------------------------------------------------------
client_push_enabled: true
client_push_target_ou: "OU=Workstations,DC=example,DC=com"
client_push_accounts:
  - "{{ sccm_install_account }}"

# ---------------------------------------------------------------------------
# Service accounts (injected by AAP Custom Credential Type)
# ---------------------------------------------------------------------------
# sccm_install_account / sccm_install_password
# sccm_naa_account / sccm_naa_password
# sql_sa_password
# domain_admin_user / domain_admin_password
